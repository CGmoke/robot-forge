## 遥控器按键映射表 —— greeting_teleop/joy_mapper 使用（config/teleop_map.yaml）

guards:
  # —— 组1：E 拨到「上」= 分段组（第 1~4 段）——
  - key: e_up
    keys:
      a: goto:1                   # E上 + A：第 1 段 欢迎致辞 + 迎宾手势
      b: goto:2                   # E上 + B：第 2 段 自我介绍 + 轻抬引导
      c: goto:3                   # E上 + C：第 3 段 大会板块 + 右臂侧指金穗厅
      d: goto:4                   # E上 + D：第 4 段 签到指引 + 左臂抬手指向

  # —— 组2：E 拨到「下」= 分段组（第 5~7 段）——
  - key: e_down
    keys:
      a: goto:5                   # E下 + A：第 5 段 欢迎致辞 + 迎宾手势
      b: goto:6                   # E下 + B：第 6 段 引路指引 + 右臂前指
      c: goto:7                   # E下 + C：第 7 段 离场祝贺 + 轻缓致意礼
## ============================================================================
## 常驻按键 keys（不受前提限制，始终生效）—— H右=急停 stop
## ============================================================================
keys:
  h_right: stop     # H 右  ：急停回 IDLE（安全键，随时可中止流程）